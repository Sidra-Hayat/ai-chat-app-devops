


services:

  backend:
    build: ./chat-backend
    container_name: sidra-chatapp-backend
    ports:
      - "5001:5000"
    env_file:
      - ./chat-backend/.env
    restart: unless-stopped
    depends_on:
      - mongo


  frontend:
    build: ./chat-frontend
    container_name: sidra-chatapp-frontend
    ports:
      - "3001:80"
    restart: unless-stopped
    depends_on:
      - backend


  mongo:
    image: mongo:7
    container_name: sidra-chatapp-mongo
    restart: unless-stopped
    volumes:
      - sidra-mongo-data:/data/db


volumes:

  sidra-mongo-data:
